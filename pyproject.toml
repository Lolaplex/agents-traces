[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-traces"
version = "0.0.1"
description = "Append-only JSONL session traces, assemble, and MCP inspect tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Felix Kempf" },
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
]
keywords = ["mcp", "agents", "traces", "trace", "observability", "metrics", "logging", "coding-assistant", "cursor", "claude", "antigravity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/agents-traces"
Repository = "https://github.com/Lolaplex/agents-traces"
Documentation = "https://github.com/Lolaplex/agents-traces/tree/main/abi"
"Bug Tracker" = "https://github.com/Lolaplex/agents-traces/issues"

[project.scripts]
agents-traces = "agents_traces.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agents_traces" = [
    "bundled/**/*",
]
