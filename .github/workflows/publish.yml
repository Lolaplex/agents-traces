name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build pytest

      - name: Sync bundled files
        run: |
          python scripts/sync_bundled.py --check || python scripts/sync_bundled.py

      - name: Run test suite
        timeout-minutes: 10
        run: |
          pip install -e .
          python tests/run_all_tests.py

      - name: Build package
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  notify:
    name: Discord
    needs: [build-and-publish]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post failure to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL unset; skip Discord notify"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json, os; print(json.dumps({'content': f\"**{os.environ['GITHUB_REPOSITORY']}** \`{os.environ['GITHUB_WORKFLOW']}\` failed on \`{os.environ['GITHUB_REF_NAME']}\`\n{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\"}))")
          HTTP=$(curl -sS -o /tmp/discord-ci-body.txt -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD" "$DISCORD_WEBHOOK_URL")
          if [ "$HTTP" = "204" ] || [ "$HTTP" = "200" ]; then
            echo "Discord notified (HTTP $HTTP)"
          else
            echo "::warning::Discord webhook HTTP ${HTTP}: $(tr -d '\0' < /tmp/discord-ci-body.txt | head -c 500)"
            exit 1
          fi
